---
homebrew_installed_packages:
  - act # run github actions locally
  - age
  - ansible-lint
  - awscli
  - aws-shell
  - azure-cli
  - bat # cat syntax highlighting
  - bash
  - btop
  - certbot
  - coreutils
  - cowsay
  - checkov # a static code analysis tool for scanning IaC files
  - datawire/blackbird/telepresence-arm64
  - dive
  - dust # improved du
  - duf # improved df
  - exa # A modern replacement for ls
  - exercism
  - fluxcd/tap/flux
  - gauge
  - git-chglog
  - git-flow
  - gnu-sed
  - gh
  - gemini-cli
  - go
  - go-swagger
  - golangci-lint
  - gping # ping, but with a graph.
  - graphviz
  - hashicorp/tap/packer
#  - hashicorp/tap/terraform
  - hashicorp/tap/vault
  - helm
  - htop
  - jq
  - k6
  - k9s
  - kind
  - kops
  - kubebuilder
  - kubeconform
  - kubectx
  - kubernetes-cli
  - kubeseal
  - kubespy
  - kustomize
  - minikube
  - mkcert
  - mockery
  - ngrok
  - anomalyco/tap/opencode
  - openstackclient
  - pyenv
  - uv
  - volta
  - python-yq
  - rs/tap/curlie
  - skaffold
  - sonar-scanner
  - sops
  - speedtest-cli
  - stern
  - terragrunt
  - tflint # A Pluggable Terraform Linter
  - tree
  - unzip
  - vegeta
  - virtualenv
  - virtualenvwrapper
  - yamllint
  - watch
  - weaveworks/tap/eksctl
  - wget

homebrew_upgrade_all_packages: true

homebrew_taps:
  - homebrew/core
  - homebrew/cask
  - fluxcd/tap
  - hashicorp/tap
  - weaveworks/tap
  - git-chglog/git-chglog
  - go-swagger/go-swagger
  - anomalyco/tap

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - claude
  - cursor
  - docker
  - drawio
  - fig # IDE-style autocomplete to terminal.
  - flock
  - flycut
  - google-cloud-sdk
  - google-chrome
  - google-drive
  - iterm2
  - jetbrains-toolbox
  - lens
  - lyricsx
  - mysqlworkbench
  - notion
  - ollama-app
  - opencode-desktop
  - pgadmin4
  - postman
  - robo-3t
  - sequel-pro
  - skype
  - slack
  - sourcetree
  - spectacle
  - sublime-text
  - spotify
  - switchhosts
  - telegram
  - vagrant
#  - virtualbox
  - visual-studio-code
  - vlc
  - warp
  - whatsapp
  - zoom

python_uv_python_versions:
  - 3.14.5
  - 3.13.13
  - 3.12.1
  - 3.10.8
python_uv_default_python: "3.14.5"
python_uv_tool_venv_path: "{{ ansible_facts['env']['HOME'] }}/.venvs/python"
python_uv_tool_packages:
  - docker
  - gitman
  - psutil
  - pytest
  - refurb

node_volta_home: "{{ ansible_facts['env']['HOME'] }}/.volta"
node_volta_command: "volta"
node_volta_default_node: "node@lts"
node_volta_extra_nodes:
  - "node@latest"
node_npm_global_packages:
  - "@github/copilot"
