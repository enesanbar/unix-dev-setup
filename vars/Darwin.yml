  - vegeta
  - virtualenv
  - virtualenvwrapper
  - yamllint
  - yarn
  - watch
  - weaveworks/tap/eksctl
  - wget

homebrew_upgrade_all_packages: true

homebrew_taps:
  - homebrew/core
  - homebrew/cask
  - fluxcd/tap
  - hashicorp/tap
  - weaveworks/tap
  - git-chglog/git-chglog
  - go-swagger/go-swagger

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - docker
  - drawio
  - fig # IDE-style autocomplete to terminal.
  - flock
  - flycut
  - google-cloud-sdk
  - google-chrome
  - google-drive
  - iterm2
  - jetbrains-toolbox
  - lens
  - lyricsx
  - mysqlworkbench
  - notion
  - pgadmin4
  - postman
  - robo-3t
  - sequel-pro
  - skype
  - slack
  - sourcetree
  - spectacle
  - sublime-text
  - spotify
  - switchhosts
  - telegram
  - vagrant
#  - virtualbox
  - visual-studio-code
  - vlc
  - whatsapp
  - zoom

python_virtual_envs_folder: "{{ ansible_facts['env']['HOME'] }}/.venv"
python_virtual_env_python: "{{ python_virtual_envs_folder }}/python"
python_virtual_env_pip_packages:
  - docker
  - gitman
  - psutil
  - pytest
  - refurb
