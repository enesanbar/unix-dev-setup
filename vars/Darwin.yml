  - duf # improved df
  - exa # A modern replacement for ls
  - exercism
  - fluxcd/tap/flux
  - gauge
  - git-chglog
  - git-flow
  - gnu-sed
  - gh
  - go
  - go-swagger
  - golangci-lint
  - gping # ping, but with a graph.
  - graphviz
  - hashicorp/tap/packer
#  - hashicorp/tap/terraform
  - hashicorp/tap/vault
  - helm
  - htop
  - jq
  - k6
  - k9s
  - kind
  - kops
  - kubebuilder
  - kubeconform
  - kubectx
  - kubernetes-cli
  - kubeseal
  - kubespy
  - kustomize
  - minikube
