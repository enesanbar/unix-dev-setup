---

# http://docs.ansible.com/ansible/playbooks_variables.html#variable-precedence-where-should-i-put-a-variable
aptcachetime: 3600
apt_ubuntu_release: "{{ ansible_facts['distribution_release'] }}"
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - podman-docker
  - containerd
  - runc

apt_repos:
  - repo_debian_filename: docker
    repo_desired_state: present
    repo_debian: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ apt_ubuntu_release }} stable
    gpg_key: https://download.docker.com/linux/ubuntu/gpg
    gpg_keyring_file: /etc/apt/keyrings/docker.gpg

  - repo_debian_filename: hashicorp
    repo_desired_state: present
    repo_debian: deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ apt_ubuntu_release }} main
    gpg_key: https://apt.releases.hashicorp.com/gpg
    gpg_keyring_file: /usr/share/keyrings/hashicorp-archive-keyring.gpg

  - repo_debian_filename: helm
    repo_desired_state: present
    repo_debian: deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main
    gpg_key: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    gpg_keyring_file: /usr/share/keyrings/helm.gpg

  - repo_debian_filename: google
    repo_desired_state: present
    repo_debian: deb [arch=amd64 signed-by=/usr/share/keyrings/google.gpg] http://dl.google.com/linux/chrome/deb/ stable main
    gpg_key: https://dl.google.com/linux/linux_signing_key.pub
    gpg_keyring_file: /usr/share/keyrings/google.gpg

  - repo_debian_filename: kubernetes
    repo_desired_state: present
    repo_debian: deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /
    gpg_key: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
    gpg_keyring_file: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

  - repo_debian_filename: cursor
    repo_desired_state: present
    repo_debian: >-
      deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/cursor.gpg]
      https://downloads.cursor.com/aptrepo stable main
    gpg_key: https://downloads.cursor.com/keys/anysphere.asc
    gpg_keyring_file: /etc/apt/keyrings/cursor.gpg
    cleanup_paths:
      - /etc/apt/sources.list.d/cursor.sources
      - /usr/share/keyrings/anysphere.gpg

  - repo_debian_filename: warpdotdev
    repo_desired_state: present
    repo_debian: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/warpdotdev.gpg]
      https://releases.warp.dev/linux/deb stable main
    gpg_key: https://releases.warp.dev/linux/keys/warp.asc
    gpg_keyring_file: /etc/apt/keyrings/warpdotdev.gpg

artifact_installs:
  - name: jetbrains-toolbox
    become: true
    source:
      type: archive
      metadata_url: https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release
      version_query: "TBA[0].build"
      download_url_query: "TBA[0].downloads.linux.link"
    binary:
      name: jetbrains-toolbox
    install:
      type: bundle
      reset: true
      directory: /opt/jetbrains-toolbox
      links:
        - source: bin/jetbrains-toolbox
          destination: /usr/local/bin/jetbrains-toolbox

  - name: opencode-desktop
    become: true
    source:
      type: deb
      metadata_url: https://api.github.com/repos/anomalyco/opencode/releases/latest
      version_query: tag_name
      download_url_query: >-
        assets[?name=='{{ opencode_desktop_linux_deb_asset_name }}']
        .browser_download_url | [0]
    install:
      type: package

  - name: kind
    become: true
    source:
      type: binary
      metadata_url: https://api.github.com/repos/kubernetes-sigs/kind/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'kind-linux-amd64')].browser_download_url | [0]"
    destination: /usr/local/bin/kind
    mode: "0755"

  - name: kubebuilder
    become: true
    source:
      type: binary
      metadata_url: https://api.github.com/repos/kubernetes-sigs/kubebuilder/releases/latest
      version_query: tag_name
      download_url_query: "assets[?name=='kubebuilder_linux_amd64'].browser_download_url | [0]"
    destination: /usr/local/bin/kubebuilder
    mode: "0755"

  - name: stern
    become: true
    source:
      type: archive
      metadata_url: https://api.github.com/repos/stern/stern/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'stern_') && ends_with(name, 'linux_amd64.tar.gz')].browser_download_url | [0]"
    binary:
      name: stern
    destination: /usr/local/bin/stern
    mode: "0755"

  - name: mkcert
    become: true
    source:
      type: binary
      metadata_url: https://api.github.com/repos/FiloSottile/mkcert/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'mkcert') && contains(name, 'linux-amd64')].browser_download_url | [0]"
    destination: /usr/local/bin/mkcert
    mode: "0755"

  - name: kubeseal
    become: true
    source:
      type: archive
      metadata_url: https://api.github.com/repos/bitnami-labs/sealed-secrets/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'kubeseal-') && ends_with(name, 'linux-amd64.tar.gz')].browser_download_url | [0]"
    binary:
      name: kubeseal
    destination: /usr/local/bin/kubeseal
    mode: "0755"

  - name: terragrunt
    become: true
    source:
      type: binary
      metadata_url: https://api.github.com/repos/gruntwork-io/terragrunt/releases/latest
      version_query: tag_name
      download_url_query: "assets[?name=='terragrunt_linux_amd64'].browser_download_url | [0]"
    destination: /usr/local/bin/terragrunt
    mode: "0755"

  - name: argocd
    become: true
    source:
      type: binary
      metadata_url: https://api.github.com/repos/argoproj/argo-cd/releases/latest
      version_query: tag_name
      download_url_query: "assets[?name=='argocd-linux-amd64'].browser_download_url | [0]"
    destination: /usr/local/bin/argocd
    mode: "0755"

  - name: sops
    become: true
    source:
      type: binary
      metadata_url: https://api.github.com/repos/mozilla/sops/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'sops-v') && ends_with(name, '.linux.amd64')].browser_download_url | [0]"
    destination: /usr/local/bin/sops
    mode: "0755"

  - name: vegeta
    become: true
    source:
      type: archive
      metadata_url: https://api.github.com/repos/tsenart/vegeta/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'vegeta_') && ends_with(name, 'linux_amd64.tar.gz')].browser_download_url | [0]"
    binary:
      name: vegeta
    destination: /usr/local/bin/vegeta
    mode: "0755"

  - name: helm-docs
    become: true
    source:
      type: archive
      metadata_url: https://api.github.com/repos/norwoodj/helm-docs/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'helm-docs_') && ends_with(name, 'Linux_x86_64.tar.gz')].browser_download_url | [0]"
    binary:
      name: helm-docs
    destination: /usr/local/bin/helm-docs
    mode: "0755"

  - name: chart-testing
    become: true
    source:
      type: archive
      metadata_url: https://api.github.com/repos/helm/chart-testing/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'chart-testing_') && ends_with(name, 'linux_amd64.tar.gz')].browser_download_url | [0]"
    binary:
      name: ct
    destination: /usr/local/bin/ct
    mode: "0755"

  - name: dive
    become: true
    source:
      type: archive
      metadata_url: https://api.github.com/repos/wagoodman/dive/releases/latest
      version_query: tag_name
      download_url_query: "assets[?contains(name, 'dive_') && ends_with(name, 'linux_amd64.tar.gz')].browser_download_url | [0]"
    binary:
      name: dive
    destination: /usr/local/bin/dive
    mode: "0755"

  - name: uv
    become: true
    source:
      type: archive
      metadata_url: https://api.github.com/repos/astral-sh/uv/releases/latest
      version_query: tag_name
      download_url_query: "assets[?name=='uv-x86_64-unknown-linux-gnu.tar.gz'].browser_download_url | [0]"
    binary:
      name: uv
    install:
      type: bundle
      reset: true
      directory: /opt/uv
      links:
        - source: uv
          destination: /usr/local/bin/uv
        - source: uvx
          destination: /usr/local/bin/uvx

  - name: volta
    become: false
    source:
      type: archive
      metadata_url: https://api.github.com/repos/volta-cli/volta/releases/latest
      version_query: tag_name
      download_url_query: "assets[?ends_with(name, 'linux.tar.gz')].browser_download_url | [0]"
    install:
      type: bundle
      content_root: "."
      directory: "{{ node_volta_home }}/bin"

remote_script_installs:
  - name: ollama
    become: true
    url: https://ollama.com/install.sh

apt_installed_packages:
  # FUSE requirements for jetbrains-toolbox
  - libfuse2
  - libxi6
  - libxrender1
  - libxtst6
  - mesa-utils
  - libfontconfig
  - libgtk-3-bin
  # END FUSE requirements

  - apt-transport-https
  - bat
  - btop
  - certbot
  - curl
  - libcurl4-openssl-dev
  - libssl-dev
  
  # DOCKER start
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  # DOCKER end

  - evolution
  - evolution-plugins
  - cursor
  - eza
  - fonts-powerline
  - helm
  - htop
  - gimp
  - git
  - google-chrome-stable
  - gpg
  - guake
  - kubectl
  - libnss3-tools
  - jq
  - make
  - network-manager-openvpn-gnome
  - packer
  - python-is-python3
  - python3-virtualenv
  - python3-dev
  - python3-pip
  - terminator
  - terraform
  - unzip
  - vagrant
  - vault
  - virtualenvwrapper
  - vim
  - vlc
  - warp-terminal
  - yamllint
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - zoxide
  - wget


snap_installed_packages:
  - name: code
    classic: true
  - name: ghostty
    classic: true
  - name: dbeaver-ce
    classic: true
  - name: gitkraken
    classic: true
  - name: flock-chat
    classic: false
  - name: go
    classic: true
    channel: latest/stable
  - name: kubectx
    classic: true
  - name: postman
    classic: false
  - name: slack
    classic: false
  - name: spotify
    classic: false
  - name: trello-desktop
    classic: false
python_uv_python_versions:
  - 3.14.5
  - 3.13.13
  - 3.12.1
  - 3.10.8
python_uv_default_python: "3.14.5"
python_uv_tool_venv_path: "{{ ansible_facts['env']['HOME'] }}/.venvs/python"
python_uv_tool_packages:
  - docker
  - gitman
  - psutil
  - pytest
  - refurb

node_volta_home: "{{ ansible_facts['env']['HOME'] }}/.volta"
node_volta_command: "{{ node_volta_home }}/bin/volta"
node_volta_default_node: "node@lts"
node_volta_extra_nodes:
  - "node@latest"
node_npm_global_packages:
  - "@github/copilot"
  - "@google/gemini-cli"
  - "opencode-ai"

linux_release_architecture_map:
  x86_64: amd64
  aarch64: arm64
linux_release_architecture: >-
  {{
    linux_release_architecture_map.get(
      ansible_facts['architecture'],
      ansible_facts['architecture']
    )
  }}

opencode_desktop_linux_deb_asset_name: >-
  opencode-desktop-linux-{{ linux_release_architecture }}.deb
