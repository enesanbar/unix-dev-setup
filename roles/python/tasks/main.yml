- name: Install uv-managed Python versions
  ansible.builtin.command:
    argv:
      - uv
      - python
      - install
      - "{{ item }}"
  loop: "{{ python_uv_python_versions }}"
  register: uv_python_install_result
  changed_when: "'already installed' not in ((uv_python_install_result.stdout | default('')) ~ (uv_python_install_result.stderr | default('')) | lower)"

- name: Ensure uv Python tools virtualenv exists
  ansible.builtin.command:
    argv:
      - uv
      - venv
      - "{{ python_uv_tool_venv_path }}"
      - --python
      - "{{ python_uv_default_python }}"
  args:
    creates: "{{ python_uv_tool_venv_path }}/bin/python"

- name: Install Python tool packages with uv
  ansible.builtin.command:
    argv: "{{ ['uv', 'pip', 'install', '--python', python_uv_tool_venv_path ~ '/bin/python'] + python_uv_tool_packages }}"
  register: uv_python_tools_result
  changed_when: "'installed' in (((uv_python_tools_result.stdout | default('')) ~ (uv_python_tools_result.stderr | default(''))) | lower) or 'uninstalled' in (((uv_python_tools_result.stdout | default('')) ~ (uv_python_tools_result.stderr | default(''))) | lower)"
