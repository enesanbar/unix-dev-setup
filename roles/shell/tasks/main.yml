---
# tasks file for shell
- name: Import install_debian.yml if OS family is Debian
  import_tasks: oh-my-zsh-conf.yml

- name: Import install_debian.yml if OS family is Debian
  import_tasks: install_debian.yml
  when: ansible_os_family == "Debian"

- name: Import install_debian.yml if OS family is Debian
  import_tasks: install_kubectx_completions.yml
  when: ansible_os_family == "Debian"

# compinit rejects world- or group-writable directories on its fpath, and on
# macOS every plugin and completion lands in the shared 'staff' group. This
# runs last so it covers the plugin clones and completions installed above.
# No become: everything under here is owned by the invoking user, and running
# it as root would resolve the path against root's home instead.
- name: Set permissions of oh-my-zsh
  ansible.builtin.file:
    path: "{{ oh_my_zsh_path | expanduser }}"
    state: directory
    mode: 'go-w'
    recurse: yes

- name: Copy rc files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  with_items:
    - src: pythonrc.py
      dest: "{{ python_startup_file_location }}"
    - src: gitignore
      dest: "{{ global_gitignore_path }}"

- name: Copy templates dotfiles
  ansible.builtin.template:
    src: "{{ file.src }}"
    dest: "{{ file.dest }}"
  with_items:
    - src: "gitconfig.j2"
      dest: "{{ global_gitconfig_path }}"
  loop_control:
    loop_var: file
