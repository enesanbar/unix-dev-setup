---
- name: change user shell to zsh
  become: yes
  user:
    name: "{{ ansible_facts['env']['USER']}}"
    shell: /bin/zsh

- name: Install oh my zsh
  ansible.builtin.git:
    repo: git@github.com:ohmyzsh/ohmyzsh.git
    dest: "{{ oh_my_zsh_path }}"

- name: Download bullet-train theme for oh-my-zsh
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/caiogondim/bullet-train.zsh/master/bullet-train.zsh-theme
    dest: "{{ oh_my_zsh_bullet_train_path }}"

- name: Add kubectx to the bullet-train theme
  lineinfile:
    path: "{{ oh_my_zsh_bullet_train_path }}"
    line: '    kctx'
    insertbefore: "    cmd_exec_time"

#- name: Setup powerline fonts

- name: Write zshrc to home directory
  ansible.builtin.template:
    src: zshrc.j2
    dest: "~/.zshrc"

- name: Ensure dotfiles dir exists
  ansible.builtin.file:
    path: "{{ shell_dotfiles_dir }}"
    state: directory

- name: Write shell files to dotfiles directory
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  with_items: "{{ shell_files_to_source }}"

- name: Make sure private file exists
  file:
    path: "{{ shell_private_exports }}"
    state: touch


##### ZSH Plugins
# Earlier runs cloned these straight into the oh-my-zsh repo. Where
# oh-my-zsh bundles a plugin of the same name its checkout overwrites the
# clone's files, and the clone then refuses to update because its worktree
# looks locally modified. Nothing oh-my-zsh ships carries a nested .git, so
# any that turns up under plugins/ is a leftover clone to clear out.
- name: Look for plugin clones left inside the oh-my-zsh repo
  ansible.builtin.find:
    paths: "{{ oh_my_zsh_path | expanduser }}/plugins"
    patterns: ".git"
    file_type: any
    hidden: true
    recurse: true
    depth: 2
  register: oh_my_zsh_stale_plugins

- name: Remove plugin clones left inside the oh-my-zsh repo
  ansible.builtin.file:
    path: "{{ stale.path | dirname }}"
    state: absent
  register: oh_my_zsh_stale_plugins_removed
  with_items: "{{ oh_my_zsh_stale_plugins.files }}"
  loop_control:
    loop_var: stale
    label: "{{ stale.path | dirname | basename }}"

- name: Restore the bundled plugins those clones displaced
  ansible.builtin.command:
    cmd: git checkout -- plugins
    chdir: "{{ oh_my_zsh_path | expanduser }}"
  when: oh_my_zsh_stale_plugins_removed is changed
  changed_when: true

- name: Install oh my zsh plugins
  ansible.builtin.git:
    repo: "{{ plugin.repo }}"
    dest: "{{ oh_my_zsh_custom_path }}/plugins/{{ plugin.name }}"
  with_items: "{{ oh_my_zsh_plugins }}"
  loop_control:
    loop_var: plugin
    label: "{{ plugin.name }}"

##### COMPLETIONS
- name: Ensure completions dir exists
  become: false
  ansible.builtin.file:
    path: "{{ oh_my_zsh_path }}/completions"
    state: directory
    mode: '0755'
    recurse: yes

- name: Copy completion files to .oh-my-zsh dir
  ansible.builtin.copy:
    src: "{{ completion_file.src }}"
    dest: "{{ completion_file.dest }}"
  with_items:
    - src: /snap/kubectx/current/completion/kubectx.bash
      dest: "{{ oh_my_zsh_path }}/completions/kubectx.bash"
    - src: /snap/kubectx/current/completion/kubens.bash
      dest: "{{ oh_my_zsh_path }}/completions/kubens.bash"
  loop_control:
    loop_var: completion_file
  when: ansible_os_family == "Debian"
