---
- name: SSH Server | Install openssh-server
  become: true
  ansible.builtin.apt:
    pkg: openssh-server
    state: present
    update_cache: true
    cache_valid_time: "{{ aptcachetime }}"

# Drop-ins are read before the rest of sshd_config and the first value wins,
# so a low number makes these settings take precedence (e.g. over 50-cloud-init.conf).
- name: SSH Server | Configure hardened sshd drop-in
  become: true
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: SSH Server | Enable and start ssh
  become: true
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

- name: SSH Server | Allow ssh from LAN in ufw (does not enable ufw)
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ ssh_server_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: ssh from LAN
  loop: "{{ ssh_server_allowed_networks }}"

- name: SSH Server | Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "~/.ssh"
    state: directory
    mode: "0700"

# Public keys are added manually; this only makes sure the file exists with sane permissions.
- name: SSH Server | Ensure authorized_keys exists
  ansible.builtin.file:
    path: "~/.ssh/authorized_keys"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
